spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# @DataJpaTest would otherwise swap in its own embedded H2 database without a connection pool,
# which closes the connection that created the tables. H2 then fails on CHECK constraints with
# IN (...) lists (app_user.color_theme): "The database has been closed". With the pooled H2
# database configured above, that connection stays open for the whole test run.
spring.test.database.replace=none
