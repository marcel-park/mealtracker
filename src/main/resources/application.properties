spring.application.name=mealtracker

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/mealtracker}
spring.datasource.username=${DB_USER:mealtracker}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Lazy relations (the food of each meal or recipe item, the portions of each food) are loaded for up
# to 50 parents in one query instead of one query each, also when they are reached one by one.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.config.import=optional:file:./.env[.properties]