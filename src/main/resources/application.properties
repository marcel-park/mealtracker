spring.application.name=mealtracker

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/mealtracker}
spring.datasource.username=${DB_USER:mealtracker}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
# Every SQL statement on the console costs time on each request. To see them while developing:
# SPRING_JPA_SHOW_SQL=true (environment) or spring.jpa.show-sql=true in .env.
spring.jpa.show-sql=false
# Lazy relations (the food of each meal or recipe item, the portions of each food) are loaded for up
# to 50 parents in one query instead of one query each, also when they are reached one by one.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.config.import=optional:file:./.env[.properties]

# Responses from 2 KB on (JSON among the default types) are sent gzip-compressed, the app's WebView
# unpacks them: a page of search results shrinks to a fraction, which matters on mobile data.
server.compression.enabled=true
