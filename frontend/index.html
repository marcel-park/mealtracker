<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // The color theme before the first paint, also before login: the one remembered on this
      // device (see src/theme.js, same storage key), SYSTEM following the device setting.
      ;(function () {
        var theme = 'SYSTEM'
        try {
          theme = localStorage.getItem('mealtracker.colorTheme') || 'SYSTEM'
        } catch (e) {}
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = theme === 'DARK' || (theme === 'SYSTEM' && systemDark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
